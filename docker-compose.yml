services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-colaboradores-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_colaboradores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gestao-colaboradores-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_colaboradores"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gestao-colaboradores-db-data:
